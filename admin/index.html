<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<script>try{var d=localStorage.getItem('design');if(/^(siddhi|mukha|dhokra|atreyee|bangarh)$/.test(d))document.documentElement.setAttribute('data-theme',d);var o=JSON.parse(localStorage.getItem('designOverrides')||'null');if(o){var m={ctaInk:'cta-ink',heroAccent:'hero-accent',tickerInk:'ticker-ink'};var st=document.documentElement.style;var ov=o.overrides||{};for(var k in ov){if(!/^[a-zA-Z]+$/.test(k))continue;var v=ov[k];if(typeof v!=='string'||!/^#[0-9a-fA-F]{6}$/.test(v))continue;st.setProperty('--'+(m[k]||k),v)}var F=['Baloo Da 2','Hind Siliguri','Tiro Bangla','Atma'];if(o.fonts&&F.indexOf(o.fonts.display)>-1)st.setProperty('--display','"'+o.fonts.display+'", "Hind Siliguri", sans-serif');if(o.fonts&&F.indexOf(o.fonts.body)>-1)st.setProperty('--body','"'+o.fonts.body+'", "Noto Sans Bengali", system-ui, sans-serif')}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&family=Atma:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<header class="adm-top">
  <strong id="adm-title">Admin</strong>
  <span class="grow"></span>
  <button id="adm-lang" class="btn-sm" type="button">EN</button>
  <button id="adm-logout" class="btn-sm" type="button" hidden></button>
</header>

<section id="adm-login" hidden>
  <form id="adm-login-form" class="card">
    <h2 data-t="admin.login"></h2>
    <label><span data-t="admin.email"></span><input name="email" type="email" autocomplete="username" required></label>
    <label><span data-t="admin.password"></span><input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
    <button class="btn" type="submit" data-t="admin.login"></button>
    <p id="adm-login-err" class="err" role="alert"></p>
  </form>
</section>

<main id="adm-main" hidden></main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
