<!-- GitHub Pages serves this file (from the repo root) for any missing path under
     /trust_webpage/…, but keeps the ORIGINAL bad URL in the address bar — so a relative asset
     path here would resolve against that URL's own depth, not the site root. This must be the
     very first script in <head>, before any <link>/<script src> below, so the injected <base>
     is in place before the parser starts fetching them. Locally (served at "/"), the pathname
     never starts with "/trust_webpage/" and base stays "/" — a no-op, since local root already
     IS "/". See docs/superpowers/specs/2026-09-12-phase-7-site-basics.md and
     docs/site-basics-audit-2026-09-12.md item 1 (GitHub-live behaviour verified in Task 8). -->
<script>(function(){var b=location.pathname.indexOf('/trust_webpage/')===0?'/trust_webpage/':'/';document.head.prepend(Object.assign(document.createElement('base'),{href:b}));})();</script>
